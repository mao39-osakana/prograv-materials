<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>PRO-GRAV｜フェーズ別KSF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101c31;
    --navy-2:#1b2c49;
    --ink:#101c31;
    --sub:#4a5872;
    --line:#d9dfe9;
    --bg:#ffffff;
    --tint:#f4f6fa;
    --tint2:#eef1f7;
    --grad:linear-gradient(100deg,#f6c945 0%,#f59b2e 60%,#ef7f22 100%);
    --grad-soft:linear-gradient(100deg,#fdf3d3,#fde3c2);
    --radius:14px;
    --shadow:0 6px 18px rgba(16,28,49,.10);
    --hdr:48px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
    background:var(--bg);color:var(--ink);
    line-height:1.7;font-size:16px;
    overflow-x:hidden;
    padding-top:var(--hdr);
  }
  button{font-family:inherit;cursor:pointer;min-height:44px}
  :focus-visible{outline:3px solid #f59b2e;outline-offset:2px}

  /* ============ GLOBAL HEADER (all views) ============ */
  .g-head{
    position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:60;
    background:rgba(255,255,255,.97);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .g-head-in{
    max-width:640px;margin:0 auto;height:100%;padding:0 14px;
    display:flex;align-items:center;gap:10px;
  }
  .g-logo{
    display:inline-flex;align-items:baseline;gap:8px;background:none;border:none;
    padding:6px 4px;min-height:44px;color:var(--navy);transform:translateY(3px);
  }
  .g-logo .wm{
    font-family:'Libre Baskerville',serif;
    font-size:19px;font-weight:700;letter-spacing:.06em;line-height:1;
    padding-bottom:4px;position:relative;
  }
  .g-logo .wm::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:3.5px;border-radius:99px;background:var(--grad);
  }
  .g-logo .tag{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.08em}
  .g-crumb{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  body:has(#view-home.open){background:#f3f5f8}
  .view{display:none}
  .view.open{display:block;animation:fadeUp .3s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* No transform here: a retained transform on .view makes iOS Safari offset the
     sticky .sub-head by an extra var(--hdr), opening a gap under the fixed header. */
  @keyframes zoomIn{from{opacity:0}to{opacity:1}}
  .view.zoom.open{animation:zoomIn .32s ease both}

  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 26px}
  .step-label{
    display:inline-block;font-size:12px;font-weight:900;letter-spacing:.1em;
    color:#b96a12;padding:0;
  }
  .page-title{font-size:clamp(22px,6.2vw,30px);font-weight:900;line-height:1.35;margin:10px 0 4px;letter-spacing:.01em}
  .page-title .thin{font-weight:500;font-size:.62em;color:var(--sub)}
  .page-lead{font-size:13.5px;color:var(--sub);margin:0 0 2px}
  .map-progress{display:flex;align-items:center;gap:10px;margin:8px 0 2px}
  .map-progress .bar{flex:1 1 auto;min-width:48px;height:8px;border-radius:99px;background:#d7dde8;overflow:hidden}
  .map-progress .bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .4s ease}
  .map-progress .txt{font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap}
  .map-progress .txt b{font-size:15px}
  .back-btn{
    display:inline-flex;align-items:center;gap:3px;
    background:none;color:var(--navy);border:none;border-radius:8px;
    font-size:14px;font-weight:900;padding:6px 10px 6px 2px;min-height:40px;
  }
  .back-row{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin-bottom:2px}
  .where-txt{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em}
  .where-txt b{color:var(--navy)}
  .connector{display:flex;justify-content:center;padding:1px 0}
  .connector svg{display:block}

  /* ============ HOME / STEP MAP boxes ============ */
  .step-box{
    position:relative;text-align:left;width:100%;
    border-radius:var(--radius);padding:13px 15px 14px;
    background:#fff;border:2px solid var(--navy);color:var(--ink);
    box-shadow:var(--shadow);transition:transform .15s ease;
    display:block;
  }
  button.step-box:active{transform:scale(.99)}
  .step-box .s-kicker{font-size:11px;font-weight:900;letter-spacing:.1em;color:#b96a12}
  .step-box .s-title{font-size:20px;font-weight:900;line-height:1.3;margin:1px 0 2px}
  .step-box .s-one{font-size:13px;color:var(--sub);line-height:1.55;margin:0 0 8px}
  .step-box .s-prog{font-size:12px;font-weight:700;color:var(--navy)}
  .step-box .s-prog b{font-size:14px}
  .step-box .s-bar{height:6px;border-radius:99px;background:var(--tint2);overflow:hidden;margin:5px 0 9px}
  .step-box .s-bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
  .step-box--soon{border-color:#c8cfdd;background:var(--tint);box-shadow:none;cursor:default}
  .step-box--soon .s-title{color:var(--sub)}
  .soon-badge{
    display:inline-block;font-size:11px;font-weight:900;letter-spacing:.06em;
    background:#c8cfdd;color:var(--navy-2);border-radius:999px;padding:2px 10px;vertical-align:2px;margin-left:8px;
  }
  .ksf-chips{display:flex;flex-wrap:wrap;gap:6px}
  .ksf-chip{
    font-size:12px;font-weight:700;color:var(--navy);background:var(--tint);
    border:1.5px solid var(--line);border-radius:999px;padding:4px 11px;line-height:1.4;
  }
  .ksf-chip.done{border-color:#f0b23e;background:#fdf3d3}
  .ksf-chip.soon{color:var(--sub);background:#fff;border-style:dashed}
  .ksf-chip .c-prog{font-size:11px;color:var(--sub);font-weight:700}

  /* ============ formula (Step maps) ============ */
  .formula{
    background:var(--tint);border-radius:var(--radius);padding:13px 13px 11px;margin:0 0 6px;
  }
  .formula .f-label{font-size:13px;font-weight:900;color:var(--navy);margin:0 0 8px}
  .formula .f-label span{color:#b96a12}
  .f-row{display:flex;align-items:stretch;gap:7px}
  .f-op{flex:0 0 auto;align-self:center;font-size:17px;font-weight:900;color:var(--navy)}
  .f-eq{flex:0 0 auto;align-self:center;font-size:15px;font-weight:900;color:var(--sub)}
  .f-result{
    flex:0 0 auto;align-self:center;font-size:13.5px;font-weight:900;color:var(--navy);
    background:#fff;border:2px solid #f0b23e;border-radius:10px;padding:7px 10px;line-height:1.3;text-align:center;
  }
  .ksf-box{
    flex:1 1 0;min-width:0;position:relative;text-align:left;
    border-radius:12px;padding:10px 11px 11px;
    background:#fff;border:2px solid var(--navy);color:var(--ink);
    box-shadow:var(--shadow);transition:transform .15s ease;
  }
  button.ksf-box:active{transform:scale(.985)}
  .ksf-box .k-no{font-size:10.5px;font-weight:900;letter-spacing:.08em;color:#b96a12}
  .ksf-box .k-name{font-size:15.5px;font-weight:900;line-height:1.35;margin:1px 0 3px}
  .ksf-box .k-prog{font-size:11px;color:var(--sub);font-weight:700;line-height:1.4}
  .ksf-box.done{border-color:#c8cfdd;background:var(--tint);color:var(--ink);box-shadow:none}
  .ksf-box.done .k-no{color:#b96a12}
  .ksf-box.done .k-prog{color:var(--sub)}
  .ksf-box--light{background:#fff;color:var(--ink)}
  .ksf-box--light .k-no{color:#b96a12}
  .ksf-box--light .k-prog{color:var(--sub)}
  .ksf-box--soon{background:#fff;border-color:#c8cfdd;border-style:dashed;color:var(--sub);box-shadow:none;cursor:default}
  .ksf-box--soon .k-no{color:var(--sub)}
  .ksf-box--soon .k-name{color:var(--sub)}
  .ksf-box--soon .k-prog{color:var(--sub)}
  .f-arrow{display:flex;justify-content:center;padding:2px 0}
  .goal-banner{
    background:var(--grad);border-radius:12px;padding:11px 14px;text-align:center;
    font-size:17px;font-weight:900;color:var(--navy);margin-top:4px;
  }
  .note-txt{font-size:11.5px;color:var(--sub);text-align:center;padding:8px 0 2px;margin:0;text-wrap:balance}

  /* ============ KSF MAP blocks ============ */
  .map-canvas{display:flex;flex-direction:column;padding:6px 0 2px}
  .map-canvas > .block,.map-canvas > .connector,.map-canvas > .connector-row,.map-canvas > .branch-row{flex:0 0 auto}
  .block{height:auto;overflow:visible}
  .connector-row{display:flex;align-items:stretch;gap:8px}
  /* ---- Column branch: dashed horizontal twig + thin vertical tab ---- */
  .branch-row{display:flex;align-items:stretch;gap:0;min-width:0}
  .branch-row > .block{flex:1 1 auto;width:auto;min-width:0}
  .branch-row > .connector-row{flex:1 1 auto;min-width:0}
  .branch-line{
    flex:0 0 16px;align-self:center;height:0;
    border-top:2px dashed #d9a441;
  }
  .column-tab{
    flex:0 0 50px;align-self:stretch;
    writing-mode:vertical-rl;text-orientation:upright;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:#fffaf1;border:1.5px solid #f0cf8e;border-radius:10px;
    color:#8a5a10;font-size:13px;font-weight:900;letter-spacing:.14em;
    padding:12px 0;line-height:1;
    transition:transform .15s ease;
  }
  .column-tab:active{transform:scale(.97)}
  .column-tab .ct-count{
    font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.08em;
    display:inline-flex;align-items:center;
  }
  .column-tab .tcy{text-combine-upright:all;letter-spacing:0;font-weight:900;color:#8a5a10}
  /* ---- Column list ---- */
  .col-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .col-item{
    position:relative;text-align:left;width:100%;
    border-radius:var(--radius);padding:13px 15px 14px;
    background:#fffaf1;border:1.5px solid #f0cf8e;color:var(--ink);
    box-shadow:var(--shadow);transition:transform .15s ease;
  }
  .col-item:active{transform:scale(.985)}
  .col-item .c-kicker{font-size:11px;font-weight:900;letter-spacing:.1em;color:#b96a12}
  .col-item .c-title{font-size:18px;font-weight:900;line-height:1.4;margin:1px 0 2px;padding-right:52px}
  .col-item .c-tap{
    position:absolute;top:13px;right:15px;font-size:11px;font-weight:700;color:#b96a12;
    display:flex;align-items:center;gap:2px;
  }
  .col-back-map{
    flex:1 1 auto;min-width:0;background:var(--tint2);color:var(--navy);border:none;
    border-radius:999px;font-size:15px;font-weight:900;padding:10px 16px;white-space:nowrap;
  }
  .col-empty{
    border:1.5px dashed #f0cf8e;border-radius:var(--radius);background:#fffaf1;
    padding:22px 18px;text-align:center;
  }
  .col-empty .ce-title{font-size:16px;font-weight:900;margin:0 0 4px;color:var(--navy)}
  .col-empty .ce-note{font-size:13px;color:var(--sub);margin:0;line-height:1.6}
  .block{
    position:relative;text-align:left;width:100%;
    border-radius:var(--radius);padding:13px 15px 14px;
    background:#fff;border:2px solid var(--navy);
    color:var(--ink);box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .block:active{transform:scale(.985)}
  .block .b-kicker{font-size:11px;font-weight:900;letter-spacing:.1em;color:#b96a12}
  .block:has(.b-tap) .b-kicker{padding-right:56px}
  .block .b-title{font-size:19px;font-weight:900;line-height:1.3;margin:1px 0 2px}
  .block .b-one{font-size:13px;color:var(--sub);line-height:1.55;margin:0}
  .block .b-tap{
    position:absolute;top:13px;right:15px;font-size:11px;font-weight:700;color:#b96a12;
    display:flex;align-items:center;gap:2px;
  }
  .block .done-badge{
    position:absolute;top:-9px;right:12px;display:none;
    background:var(--navy);color:#fff;font-size:11px;font-weight:900;
    border-radius:999px;padding:2px 10px;letter-spacing:.05em;z-index:2;
  }
  .block.done{border-color:#c8cfdd;background:var(--tint);box-shadow:none}
  .block.done .done-badge{display:block}
  .block.done .b-title{color:var(--navy-2)}
  .block.done .b-tap{display:none}
  .block--why{background:var(--navy);border-color:var(--navy);color:#fff}
  .block--why .b-kicker{color:#f6c945}
  .block--why .b-one{color:#c9d3e4}
  .block--why .b-tap{color:#f6c945}
  .block--why.done{background:var(--tint);border-color:#c8cfdd;color:var(--ink)}
  .block.block--why.done .b-title{color:var(--navy-2)}
  .block.block--why.done .b-kicker{color:#b96a12}
  .block.block--why.done .b-one{color:var(--sub)}
  .block--steps{border:2.5px solid transparent;background:
    linear-gradient(#fff,#fff) padding-box, var(--grad) border-box;padding:13px 15px 14px}
  .block--steps.done{background:linear-gradient(var(--tint),var(--tint)) padding-box, var(--grad) border-box}
  .stage-chain{display:flex;flex-direction:column;gap:0;margin-top:7px}
  .stage{
    display:flex;align-items:center;gap:9px;background:var(--tint);
    border-radius:9px;padding:5px 10px;
  }
  .stage .s-no{
    flex:0 0 auto;font-size:11px;font-weight:900;color:#fff;background:var(--navy);
    border-radius:6px;padding:1px 7px;letter-spacing:.03em;white-space:nowrap;
  }
  .stage .s-name{font-size:13.5px;font-weight:700;line-height:1.35;min-width:0}
  .stage .s-when{margin-left:auto;font-size:11px;color:var(--sub);white-space:nowrap;flex:0 0 auto;padding-left:6px}
  .stage-arrow{display:flex;justify-content:flex-start;padding:0 0 0 20px;color:#e08a1e;font-size:11px;line-height:1.15;font-weight:900}
  .block--half{flex:1 1 0;min-width:0;padding:13px 15px 14px}
  .block--half .b-title{font-size:16.5px}
  .block--half .b-one{font-size:12.5px}
  .block--warn{border-color:var(--navy);background:#fffaf1}
  .block--warn .b-kicker{color:#b96a12}
  .vs{
    flex:0 0 auto;align-self:center;font-size:11px;font-weight:900;color:var(--sub);
    background:var(--tint2);border-radius:999px;padding:3px 8px;
  }
  .block--goal{background:linear-gradient(100deg,#f8d254 0%,#f7a838 60%,#f0862a 100%);border-color:transparent;color:var(--navy)}
  .block--goal .b-kicker{color:#7a4a08}
  .block--goal .b-one{color:#4d3a14}
  .block--goal .b-tap{color:#7a4a08}
  .block--goal .done-badge{background:var(--navy)}
  .block--goal.done{background:var(--tint);border:2px solid #c8cfdd}
  .all-done{
    display:none;background:var(--grad);border-radius:var(--radius);
    padding:14px 16px;margin-top:10px;margin-bottom:22px;text-align:center;
  }
  .all-done.show{display:block}
  .all-done p{margin:0;font-weight:900;font-size:15.5px;color:var(--navy)}
  .all-done .sub{font-weight:500;font-size:12.5px;color:#5c4512}
  .test-banner{
    display:none;background:var(--navy);color:#fff;border-radius:var(--radius);
    padding:16px;margin-top:10px;box-shadow:var(--shadow);
  }
  .test-banner.show{display:block;animation:fadeUp .35s ease both}
  .test-banner .tb-kicker{font-size:11px;font-weight:900;letter-spacing:.1em;color:#f6c945;margin:0}
  .test-banner h2{font-size:19px;font-weight:900;line-height:1.4;margin:4px 0 4px}
  .test-banner p{font-size:13.5px;color:#c9d3e4;margin:0 0 6px;line-height:1.6}
  .test-banner .tb-score{
    display:none;font-size:14px;font-weight:900;color:#fff;background:var(--navy-2);
    border:1.5px solid #f0b23e;border-radius:10px;padding:8px 12px;margin:8px 0;
  }
  .test-banner .tb-score.show{display:block}
  .test-banner .tb-score b{color:#f6c945;font-size:17px}
  .tb-btn{
    display:block;width:100%;background:var(--grad);color:var(--navy);border:none;
    border-radius:999px;font-size:15.5px;font-weight:900;padding:12px 16px;margin-top:10px;
  }
  .map-foot{flex:0 0 auto;text-align:center;font-size:11.5px;color:var(--sub);padding:6px 0 2px;margin:0;text-wrap:balance}

  /* ============ DETAIL ============ */
  .sub-head{
    position:sticky;top:var(--hdr);z-index:20;background:rgba(255,255,255,.96);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  }
  .sub-head-in{max-width:640px;margin:0 auto;padding:4px 14px 7px}
  .minimap{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .minimap button{
    border:1.5px solid var(--line);background:#fff;border-radius:7px;
    font-size:11px;font-weight:700;color:var(--sub);padding:3px 8px;min-height:32px;
    line-height:1.25;position:relative;min-width:0;white-space:nowrap;
  }
  .minimap button.cur{border-color:var(--navy);background:var(--navy);color:#fff}
  .minimap button.is-done{border-color:#f0b23e;background:#fdf3d3;color:var(--navy)}
  .minimap button.is-done.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
  .minimap button .mm-check{font-size:9px}
  .d-body{width:100%;max-width:640px;margin:0 auto;padding:14px 18px 30px}
  .panel h2{font-size:clamp(25px,7vw,34px);font-weight:900;line-height:1.35;margin:2px 0 10px}
  .p-kicker{font-size:12px;font-weight:900;letter-spacing:.1em;color:#b96a12;margin:20px 0 0}
  .panel h3{
    font-size:19px;font-weight:900;line-height:1.45;margin:34px 0 8px;
    padding-left:12px;border-left:5px solid #f59b2e;
  }
  .panel h4{font-size:16.5px;font-weight:900;margin:24px 0 6px}
  .panel p{font-size:16px;margin:0 0 14px}
  .panel p.big{font-size:18.5px;font-weight:700;line-height:1.75}
  .panel .note{font-size:13.5px;color:var(--sub)}
  .hl{background:linear-gradient(transparent 62%,#fde3a8 62%);font-weight:700}
  .navy-box{background:var(--navy);color:#fff;border-radius:var(--radius);padding:18px;margin:18px 0}
  .navy-box p{margin:0;font-size:17px;font-weight:700;line-height:1.8}
  .navy-box .small{font-size:13.5px;font-weight:400;color:#c9d3e4;margin-top:8px}
  .plain-box{background:var(--tint);border-radius:var(--radius);padding:16px 18px;margin:16px 0}
  .plain-box p:last-child{margin-bottom:0}
  .column-box{background:#fffaf1;border:1.5px solid #f0cf8e;border-radius:var(--radius);padding:16px 18px;margin:18px 0}
  .column-box .col-label{font-size:11px;font-weight:900;letter-spacing:.08em;color:#b96a12;margin:0 0 4px}
  .column-box p:last-child{margin-bottom:0}
  ul.tight{margin:0 0 16px;padding:0;list-style:none}
  ul.tight li{position:relative;padding:7px 0 7px 26px;font-size:15.5px;border-bottom:1px dashed var(--line)}
  ul.tight li:last-child{border-bottom:none}
  ul.tight li::before{
    content:"";position:absolute;left:4px;top:16px;width:9px;height:9px;border-radius:3px;background:var(--grad);
  }
  ul.tight li b{font-weight:900}
  .phrase{
    background:#fffaf1;border:1.5px solid #f0cf8e;border-radius:10px;
    padding:10px 14px;margin:8px 0;font-size:15.5px;font-weight:700;
  }
  .phrase span{display:block;font-size:11.5px;font-weight:900;color:#b96a12;letter-spacing:.06em;margin-bottom:2px}
  .bad-phrase{
    background:#fdf0f0;border:1.5px solid #f0b3b3;border-radius:10px;
    padding:10px 14px;margin:8px 0;font-size:15.5px;font-weight:700;
  }
  .bad-phrase span{display:block;font-size:11.5px;font-weight:900;color:#a12b2b;letter-spacing:.06em;margin-bottom:2px}
  .stage-card{border:2px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:18px 0}
  .stage-card.s1{border-color:#f0b23e}

      {t:'h3',x:'段階1〜4：テーマの進み方'},
      {t:'stage',no:'段階 1',nm:'日常の好み・居心地',wh:'3〜4回目あたり',first:true,html:'<p>答えに正解・不正解がないテーマから始めます。狙いは、価値観そのものより「一緒にいて心地いいか、日常の好みが大きくズレていないか」の確認です。</p><h5>具体テーマ</h5><ul class="tight"><li>休日の過ごし方／平日の過ごし方（朝型か夜型か、仕事終わりの過ごし方）</li><li>食事（自炊か外食か、好きな店のタイプ）</li><li>旅行（頻度、行き先の好み、計画派か行き当たりばったりか）</li><li>一人の時間と友人との付き合い方</li><li>連絡の頻度と返信のペース</li><li>恋人との過ごし方・恋愛観（どんな付き合い方が心地いいか）</li></ul><h5>聞き方の例</h5><div class="phrase">「理想の休日って、どんな過ごし方ですか」</div><div class="phrase">「平日って、仕事が終わった後は何をしていることが多いですか」</div><div class="phrase">「旅行は、計画を立てる派ですか」</div><h5>見るポイント</h5><p>好みの違いそのものより、違いが出たときに笑って話せるかどうか。ここで小さな違いを話せる関係が、次の段階の土台になります。</p>'},

      {t:'box',x:'<b>段階を進める目安：</b>前の段階のテーマで「違いがあっても話せた」という感覚が持てたかどうか。それがないまま次の段階に進むと、重いテーマほどこじれます。'},

function ksfDone(ksfId){return state.done[ksfId]||{};}
function blockCount(ksfId){var k=KSFS[ksfId];var ids=[];k.layout.forEach(function(x){if(Array.isArray(x))x.forEach(function(i){ids.push(i);});else ids.push(x);});return ids;}
function doneCount(ksfId){var d=ksfDone(ksfId);return blockCount(ksfId).filter(function(id){return d[id];}).length;}
function ksfComplete(ksfId){return doneCount(ksfId)===blockCount(ksfId).length;}

var views={home:document.getElementById('view-home'),step:document.getElementById('view-step'),ksf:document.getElementById('view-ksf'),detail:document.getElementById('view-detail'),quiz:document.getElementById('view-quiz'),collist:document.getElementById('view-collist'),coldetail:document.getElementById('view-coldetail')};
var crumb=document.getElementById('g-crumb');
var curStep=null,curKsf=null,curBlock=null,curCol=null;
function findColumn(ksfId,colId){
  var k=KSFS[ksfId];if(!k||!k.columns)return null;
  for(var i=0;i<k.columns.length;i++){if(k.columns[i].id===colId)return k.columns[i];}
  return null;
}
function columnsForBlock(ksfId,blockId){
  var k=KSFS[ksfId];if(!k||!k.columns)return [];
  return k.columns.filter(function(c){return c.attachTo===blockId;});
}
function show(name){

  window.scrollTo(0,0);

/* ---- History API: each view is one history entry, so browser Back/Forward work ---- */
var navStack=[],navIndex=-1,curNav=null;
function cleanState(s){
  if(!s||!s.view)return {view:'home'};
  if(s.view==='step'&&STEPS[s.stepId]&&!STEPS[s.stepId].soon)return {view:'step',stepId:s.stepId};
  if(s.view==='ksf'&&KSFS[s.ksfId])return {view:'ksf',ksfId:s.ksfId};
  if(s.view==='detail'&&KSFS[s.ksfId]&&KSFS[s.ksfId].blocks[s.blockId])return {view:'detail',ksfId:s.ksfId,blockId:s.blockId};
  if(s.view==='quiz'&&KSFS[s.ksfId])return {view:'quiz',ksfId:s.ksfId};
  if(s.view==='collist'&&KSFS[s.ksfId])return {view:'collist',ksfId:s.ksfId};
  if(s.view==='coldetail'&&findColumn(s.ksfId,s.colId))return {view:'coldetail',ksfId:s.ksfId,colId:s.colId};
  if(s.view==='home')return {view:'home'};
  return {view:'home'};
}
function sameState(a,b){
  return !!a&&!!b&&a.view===b.view&&a.stepId===b.stepId&&a.ksfId===b.ksfId&&a.blockId===b.blockId&&a.colId===b.colId;
}
function hashForState(s){
  if(s.view==='step')return '#/step/'+s.stepId;
  if(s.view==='ksf')return '#/ksf/'+s.ksfId;
  if(s.view==='detail')return '#/ksf/'+s.ksfId+'/block/'+s.blockId;
  if(s.view==='quiz')return '#/ksf/'+s.ksfId+'/quiz';
  if(s.view==='collist')return '#/ksf/'+s.ksfId+'/columns';
  if(s.view==='coldetail')return '#/ksf/'+s.ksfId+'/column/'+s.colId;
  return '#/';
}
function stateFromHash(){
  var h=(window.location.hash||'').replace(/^#\/?/,'');
  var parts=h.split('/').filter(function(x){return x;});
  try{
    if(parts[0]==='step'&&parts[1])return cleanState({view:'step',stepId:decodeURIComponent(parts[1])});
    if(parts[0]==='ksf'&&parts[1]&&parts[2]==='block'&&parts[3])return cleanState({view:'detail',ksfId:decodeURIComponent(parts[1]),blockId:decodeURIComponent(parts[3])});
    if(parts[0]==='ksf'&&parts[1]&&parts[2]==='quiz')return cleanState({view:'quiz',ksfId:decodeURIComponent(parts[1])});
    if(parts[0]==='ksf'&&parts[1]&&parts[2]==='columns')return cleanState({view:'collist',ksfId:decodeURIComponent(parts[1])});
    if(parts[0]==='ksf'&&parts[1]&&parts[2]==='column'&&parts[3])return cleanState({view:'coldetail',ksfId:decodeURIComponent(parts[1]),colId:decodeURIComponent(parts[3])});
    if(parts[0]==='ksf'&&parts[1])return cleanState({view:'ksf',ksfId:decodeURIComponent(parts[1])});
  }catch(e){}
  return null;
}
function withIdx(s,idx){var o={view:s.view,stepId:s.stepId,ksfId:s.ksfId,blockId:s.blockId,colId:s.colId,_idx:idx};return o;}
function applyState(raw){
  var s=cleanState(raw);curNav=s;
  if(s.view==='home'){curStep=null;curKsf=null;curBlock=null;curCol=null;renderHome();crumb.textContent='全体マップ';show('home');return;}
  if(s.view==='step'){curStep=s.stepId;curKsf=null;curBlock=null;curCol=null;renderStep(s.stepId);crumb.textContent=STEPS[s.stepId].label+'｜'+STEPS[s.stepId].name;show('step');return;}
  if(s.view==='ksf'){curKsf=s.ksfId;curStep=KSFS[s.ksfId].stepId;curBlock=null;curCol=null;renderKsf(s.ksfId);var kk=KSFS[s.ksfId];crumb.textContent=kk.stepLabel+'｜'+kk.name;show('ksf');return;}
  if(s.view==='detail'){curKsf=s.ksfId;curStep=KSFS[s.ksfId].stepId;curCol=null;showBlock(s.blockId);return;}
  if(s.view==='quiz'){curKsf=s.ksfId;curStep=KSFS[s.ksfId].stepId;curBlock=null;curCol=null;showQuiz();return;}
  if(s.view==='collist'){curKsf=s.ksfId;curStep=KSFS[s.ksfId].stepId;curBlock=null;curCol=null;renderColList(s.ksfId);crumb.textContent=KSFS[s.ksfId].stepLabel+'｜'+KSFS[s.ksfId].name+'｜コラム';show('collist');return;}
  if(s.view==='coldetail'){curKsf=s.ksfId;curStep=KSFS[s.ksfId].stepId;curBlock=null;showColumn(s.colId);return;}
}
function navigateTo(raw){
  var s=cleanState(raw);
  if(curNav&&sameState(curNav,s)){applyState(s);return;}
  navIndex++;
  navStack=navStack.slice(0,navIndex);
  navStack[navIndex]=s;
  try{history.pushState(withIdx(s,navIndex),'',hashForState(s));}catch(e){}
  applyState(s);
}
/* In-page "back" buttons: jump back to the matching entry already in the stack
   (so browser Forward can return), instead of pushing a duplicate parent entry. */
function goBackTo(raw){
  var s=cleanState(raw);
  for(var i=navIndex-1;i>=0;i--){
    if(sameState(navStack[i],s)){
      var targetIdx=i,fromState=curNav;
      try{
        history.go(i-navIndex);
        /* Fallback if history traversal is blocked (e.g. sandboxed frame):
           apply the target ourselves so the in-page back button never stalls. */
        setTimeout(function(){
          if(curNav&&sameState(curNav,fromState)){navIndex=targetIdx;applyState(s);}
        },300);
        return;
      }catch(e){break;}
    }
  }
  navigateTo(s);
}
window.addEventListener('popstate',function(e){
  var s=(e&&e.state)?cleanState(e.state):(stateFromHash()||{view:'home'});
  var idx=(e&&e.state&&typeof e.state._idx==='number')?e.state._idx:-1;
  if(idx>=0&&idx<navStack.length&&sameState(navStack[idx],s)){navIndex=idx;}
  else{
    var found=-1;
    for(var i=0;i<navStack.length;i++){if(sameState(navStack[i],s))found=i;}
    if(found>=0)navIndex=found;
    else{navIndex++;navStack=navStack.slice(0,navIndex);navStack[navIndex]=s;}
  }
  applyState(s);
});
function goHome(){navigateTo({view:'home'});}
function goStep(stepId){navigateTo({view:'step',stepId:stepId});}
function goKsf(ksfId){navigateTo({view:'ksf',ksfId:ksfId});}
function goColList(ksfId){navigateTo({view:'collist',ksfId:ksfId});}
function goColDetail(ksfId,colId){navigateTo({view:'coldetail',ksfId:ksfId,colId:colId});}
function backToColList(ksfId){goBackTo({view:'collist',ksfId:ksfId});}
function backToHome(){goBackTo({view:'home'});}
function backToStep(stepId){goBackTo({view:'step',stepId:stepId});}
function backToKsfView(ksfId){goBackTo({view:'ksf',ksfId:ksfId});}

function ksfChip(ksfId){
  var k=KSFS[ksfId];var n=doneCount(ksfId),total=blockCount(ksfId).length;

  var q=state.quiz[ksfId];

  if(typeof q==='number')prog+='・テスト '+q+'/'+k.quiz.length;
  var prefix=(k.ksfLabel===k.name)?'':esc(k.ksfLabel)+' ';
  return '<span class="ksf-chip'+(done?' done':'')+'">'+prefix+esc(k.name)+' <span class="c-prog">'+prog+'</span></span>';
}

  var totalDone=0,totalAll=0;
  Object.keys(KSFS).forEach(function(id){totalAll++;if(ksfComplete(id))totalDone++;});
  document.getElementById('home-prog-num').textContent=totalDone;
  document.getElementById('home-prog-bar').style.width=(totalAll?totalDone/totalAll*100:0)+'%';

function blockBtn(ksfId,id,half){
  var k=KSFS[ksfId],b=k.blocks[id],d=ksfDone(ksfId)[id];
  var cls='block block--'+(b.kind==='why'?'why':b.kind==='steps'?'steps':b.kind==='goal'?'goal':b.kind==='warn'?'warn':b.kind==='fail'?'fail':'plain');
  if(b.kind==='fail')cls='block';
  if(half)cls+=' block--half';
  if(d)cls+=' done';
  var inner='<span class="done-badge">✓ 読了</span>'+(half?'':'<span class="b-tap">読む ›</span>')
    +'<div class="b-kicker">'+esc(b.kicker)+'</div><div class="b-title">'+esc(b.title)+'</div>'
    +(b.one?'<p class="b-one">'+esc(b.one)+'</p>':'');
  if(b.chain){
    inner+='<div class="stage-chain">'+b.chain.map(function(s,i){
      return (i>0?'<div class="stage-arrow">▼</div>':'')+'<div class="stage"><span class="s-no">'+esc(s.no)+'</span><span class="s-name">'+esc(s.name)+'</span><span class="s-when">'+esc(s.when)+'</span></div>';
    }).join('')+'</div>';
  }
  return '<button class="'+cls+'" data-block="'+id+'" aria-label="'+esc(b.title)+'のブロックを開く">'+inner+'</button>';
}
function renderKsf(ksfId){
  var k=KSFS[ksfId];
  document.getElementById('btn-ksf-back').textContent='‹ '+k.stepLabel+'マップ';
  var total=blockCount(ksfId).length,n=doneCount(ksfId),all=ksfComplete(ksfId);
  var head='<span class="step-label">KSF</span>'
    +'<h1 class="page-title">'+k.nameHtml+'</h1>'
    +'<p class="page-lead">ブロックをタップすると、内容を読めます。</p>'
    +'<div class="map-progress"><div class="bar"><i style="width:'+(n/total*100)+'%"></i></div><div class="txt"><b>'+n+'</b> / '+total+' ブロック読了</div></div>'
    +'<div class="all-done'+(all?' show':'')+'"><p>マップを一周しました</p><p class="sub">おつかれさまでした。仕上げに、下の確認テストで理解を確かめましょう。</p></div>';
  document.getElementById('ksf-head').innerHTML=head;
  var h='';
  var colTotal=(k.columns||[]).length;
  k.layout.forEach(function(item,i){
    if(i>0)h+=ARROW;
    var isPair=Array.isArray(item);
    var rowHtml;
    if(isPair){
      rowHtml='<div class="connector-row">'+blockBtn(ksfId,item[0],true)+'<span class="vs" aria-hidden="true">＋</span>'+blockBtn(ksfId,item[1],true)+'</div>';
    }else{
      rowHtml=blockBtn(ksfId,item,false);
    }
    var isAnchor=k.colAnchor&&(isPair?item.indexOf(k.colAnchor)>=0:item===k.colAnchor);
    if(isAnchor){
      h+='<div class="branch-row">'+rowHtml
        +'<span class="branch-line" aria-hidden="true"></span>'
        +'<button class="column-tab" data-collist="'+ksfId+'" aria-label="コラム一覧を開く（'+colTotal+'件）"><span class="ct-label">コラム</span><span class="ct-count"><span class="tcy">'+colTotal+'</span>件</span></button>'
        +'</div>';
    }else{
      h+=rowHtml;
    }
  });
  document.getElementById('ksf-canvas').innerHTML=h;
  var q=state.quiz[ksfId];
  var tail='<div class="test-banner'+(all?' show':'')+'"><p class="tb-kicker">NEXT ｜ 仕上げ</p><h2>確認テストを受けましょう</h2>'
    +'<p>'+total+'つのブロックを読み終えました。確認テスト（全'+k.quiz.length+'問）で、理解できているかを確かめてください。1問ずつ、その場で答え合わせと解説が出ます。</p>'
    +(typeof q==='number'?'<div class="tb-score show">前回の結果：<b>'+q+'問</b> ／ '+k.quiz.length+'問正解</div>':'')
    +'<button class="tb-btn" id="btn-start-quiz">'+(typeof q==='number'?'確認テストを受け直す':'確認テストを受ける')+'（'+k.quiz.length+'問）</button></div>'
    +'<p class="map-foot">'+esc(k.foot)+'</p>';
  document.getElementById('ksf-tail').innerHTML=tail;
  document.querySelectorAll('#ksf-canvas [data-block]').forEach(function(b){
    b.addEventListener('click',function(){openBlock(b.getAttribute('data-block'));});
  });
  document.querySelectorAll('#ksf-canvas [data-collist]').forEach(function(b){
    b.addEventListener('click',function(){goColList(b.getAttribute('data-collist'));});
  });
  var sq=document.getElementById('btn-start-quiz');
  if(sq)sq.addEventListener('click',startQuiz);
}
document.getElementById('btn-ksf-back').addEventListener('click',function(){if(curKsf)backToStep(KSFS[curKsf].stepId);else backToHome();});

/* ================= DETAIL ================= */
var panel=document.getElementById('panel');
var doneBtn=document.getElementById('btn-done');
function openBlock(id){
  if(!curKsf||!KSFS[curKsf]||!KSFS[curKsf].blocks[id])return;
  navigateTo({view:'detail',ksfId:curKsf,blockId:id});
}
function showBlock(id){
  var k=KSFS[curKsf];if(!k||!k.blocks[id])return;
  curBlock=id;
  var b=k.blocks[id];
  panel.innerHTML='<p class="p-kicker">'+esc(b.kicker)+'</p><h2>'+b.panelTitle+'</h2>'+renderItems(b.items);
  var d=!!ksfDone(curKsf)[id];
  doneBtn.textContent=d?'読了済み（マップに戻る）':'読み終えた ✓ マップに戻る';
  doneBtn.classList.toggle('already',d);
  renderMinimap();
  crumb.textContent=k.stepLabel+'｜'+k.name+'｜'+b.mm;
  show('detail');
}
function renderMinimap(){
  var k=KSFS[curKsf];var d=ksfDone(curKsf);
  var mm=document.getElementById('minimap');
  mm.innerHTML=blockCount(curKsf).map(function(id){
    var b=k.blocks[id];
    return '<button data-mm="'+id+'" class="'+(id===curBlock?'cur':'')+(d[id]?' is-done':'')+'">'+esc(b.mm)+(d[id]?' <span class="mm-check">✓</span>':'')+'</button>';
  }).join('');
  mm.querySelectorAll('[data-mm]').forEach(function(btn){
    btn.addEventListener('click',function(){openBlock(btn.getAttribute('data-mm'));});
  });
}
function backToKsf(markDone){
  if(markDone&&curKsf&&curBlock){
    if(!state.done[curKsf])state.done[curKsf]={};
    state.done[curKsf][curBlock]=true;saveState();
    if(window.PGTrack&&ksfComplete(curKsf)){PGTrack.send({site:'KSF',kind:'既読',itemId:curKsf,itemName:(KSFS[curKsf]?KSFS[curKsf].name:curKsf)});}
  }
  var target=curKsf;curBlock=null;
  if(target)backToKsfView(target);else backToHome();
}
document.getElementById('btn-detail-back').addEventListener('click',function(){backToKsf(false);});
document.getElementById('btn-detail-back2').addEventListener('click',function(){backToKsf(false);});
doneBtn.addEventListener('click',function(){backToKsf(true);});

/* ================= COLUMNS ================= */
function renderColList(ksfId){
  var k=KSFS[ksfId];if(!k)return;
  var cols=k.columns||[];
  document.getElementById('collist-head').innerHTML='<span class="step-label">KSF</span>'
    +'<h1 class="page-title">コラム <span class="thin">（'+esc(k.name)+'）</span></h1>'
    +(cols.length?'<p class="page-lead">読みたいコラムをタップしてください。</p>':'');
  var h='';
  if(!cols.length){
    h+='<div class="col-empty"><p class="ce-title">コラムはまだありません</p><p class="ce-note">この教材のコラムは準備中です。追加され次第、ここに表示されます。</p></div>';
  }
  cols.forEach(function(c){
    h+='<button class="col-item" data-col="'+esc(c.id)+'" aria-label="コラム「'+esc(c.title)+'」を開く"><span class="c-tap">読む ›</span><div class="c-kicker">コラム</div><div class="c-title">'+esc(c.title)+'</div></button>';
  });
  document.getElementById('collist-list').innerHTML=h;
  document.querySelectorAll('#collist-list [data-col]').forEach(function(b){
    b.addEventListener('click',function(){goColDetail(ksfId,b.getAttribute('data-col'));});
  });
}
function showColumn(colId){
  var k=KSFS[curKsf];if(!k)return;
  var c=findColumn(curKsf,colId);if(!c)return;
  curCol=colId;
  var h='<p class="p-kicker">コラム</p><h2>'+esc(c.title)+'</h2>';
  c.items.forEach(function(par){h+='<p>'+par+'</p>';});
  document.getElementById('col-panel').innerHTML=h;
  crumb.textContent=k.stepLabel+'｜'+k.name+'｜コラム';
  show('coldetail');
}
document.getElementById('btn-collist-back').addEventListener('click',function(){if(curKsf)backToKsfView(curKsf);else backToHome();});
document.getElementById('btn-coldetail-back').addEventListener('click',function(){if(curKsf)backToColList(curKsf);else backToHome();});
document.getElementById('btn-coldetail-back2').addEventListener('click',function(){if(curKsf)backToColList(curKsf);else backToHome();});
document.getElementById('btn-coldetail-map').addEventListener('click',function(){if(curKsf)backToKsfView(curKsf);else backToHome();});

/* ================= QUIZ ================= */
var qIndex=0,qCorrect=0,qAnswered=false;
var qKicker=document.getElementById('q-kicker'),qQuestion=document.getElementById('q-question'),
    qChoices=document.getElementById('q-choices'),qFeedback=document.getElementById('q-feedback'),
    qFbHead=document.getElementById('q-fb-head'),qFbText=document.getElementById('q-fb-text'),
    qMain=document.getElementById('q-main'),qResult=document.getElementById('q-result'),
    qProgBar=document.getElementById('q-prog-bar'),qProgTxt=document.getElementById('q-prog-txt'),
    qNextBtn=document.getElementById('btn-quiz-next'),qRetryBtn=document.getElementById('btn-quiz-retry');
function renderQuestion(){
  var quiz=KSFS[curKsf].quiz,q=quiz[qIndex];
  qAnswered=false;
  qMain.style.display='';qResult.classList.remove('show');
  qRetryBtn.classList.remove('show');qNextBtn.classList.remove('show');
  qKicker.textContent='確認テスト ｜ 第'+(qIndex+1)+'問';
  qQuestion.textContent=q.q;
  qProgTxt.textContent='第'+(qIndex+1)+'問 ／ 全'+quiz.length+'問';
  qProgBar.style.width=(qIndex/quiz.length*100)+'%';
  qFeedback.className='q-feedback';
  qChoices.innerHTML='';
  q.c.forEach(function(choice,i){
    var btn=document.createElement('button');
    btn.className='q-choice';
    btn.innerHTML='<span class="c-no">'+(i+1)+'</span><span></span>';
    btn.querySelector('span:last-child').textContent=choice;
    btn.addEventListener('click',function(){answerQuestion(i);});
    qChoices.appendChild(btn);
  });
  window.scrollTo(0,0);
}
function answerQuestion(i){
  if(qAnswered)return;
  qAnswered=true;
  var q=KSFS[curKsf].quiz[qIndex];
  var correct=i===q.a;
  if(correct)qCorrect++;
  qChoices.querySelectorAll('.q-choice').forEach(function(b,bi){
    b.disabled=true;
    if(bi===q.a)b.classList.add('is-correct');
    else if(bi===i)b.classList.add('is-wrong');
    else b.classList.add('dim');
  });
  qFeedback.className='q-feedback show '+(correct?'ok':'ng');
  qFbHead.textContent=correct?'正解です':'不正解です（正解は '+(q.a+1)+'）';
  qFbText.textContent=q.e;
  qProgBar.style.width=((qIndex+1)/KSFS[curKsf].quiz.length*100)+'%';
  qNextBtn.textContent=qIndex===KSFS[curKsf].quiz.length-1?'結果を見る ›':'次の問題へ ›';
  qNextBtn.classList.add('show');
}
function showResult(){
  var quiz=KSFS[curKsf].quiz;
  state.quiz[curKsf]=qCorrect;saveState();
  if(window.PGTrack){PGTrack.send({site:'KSF',kind:'クイズ',itemId:curKsf,itemName:(KSFS[curKsf]?KSFS[curKsf].name:curKsf)+'（'+quiz.length+'問）',score:qCorrect});}
  qMain.style.display='none';qFeedback.className='q-feedback';qNextBtn.classList.remove('show');
  document.getElementById('q-score-num').textContent=qCorrect;
  document.getElementById('q-score-den').textContent=' ／ '+quiz.length+'問正解';
  var msg;
  if(qCorrect===quiz.length)msg='全問正解です。このKSFの内容が身についています。';
  else if(qCorrect>=Math.ceil(quiz.length*0.66))msg='よく理解できています。間違えた問題の解説と、対応するブロックを読み返してみてください。';
  else msg='まずはマップに戻って、各ブロックをもう一度読んでから受け直してみてください。';
  document.getElementById('q-score-msg').textContent=msg;
  qProgTxt.textContent='結果';qProgBar.style.width='100%';
  qResult.classList.add('show');qRetryBtn.classList.add('show');
  qNextBtn.textContent='教材マップに戻る';qNextBtn.classList.add('show');
  window.scrollTo(0,0);
}
function startQuiz(){if(!curKsf)return;navigateTo({view:'quiz',ksfId:curKsf});}
function showQuiz(){qIndex=0;qCorrect=0;renderQuestion();crumb.textContent=KSFS[curKsf].stepLabel+'｜'+KSFS[curKsf].name+'｜確認テスト';show('quiz');}
document.getElementById('btn-quiz-back').addEventListener('click',function(){if(curKsf)backToKsfView(curKsf);else backToHome();});
qRetryBtn.addEventListener('click',function(){qIndex=0;qCorrect=0;renderQuestion();});
qNextBtn.addEventListener('click',function(){
  var quiz=KSFS[curKsf].quiz;
  if(qResult.classList.contains('show')){if(curKsf)backToKsfView(curKsf);return;}
  if(qIndex<quiz.length-1){qIndex++;renderQuestion();}
  else showResult();
});

/* Initial entry: replace (not push) so Back from the first screen leaves the page. */
(function initHistory(){
  var initial=stateFromHash()||{view:'home'};
  initial=cleanState(initial);
  navStack=[initial];navIndex=0;curNav=initial;
  try{history.replaceState(withIdx(initial,0),'',hashForState(initial));}catch(e){}
  applyState(initial);
})();
})();
</script>

<script>
/* PRO-GRAV 学習記録＋会員ゲート（LINEログイン連携） */
(function(){
  var API = 'https://prograv-learn.sprout-and.workers.dev';
  var TARGET = 'ksf';
  try {
    var lt = new URLSearchParams(location.hash.slice(1)).get('lt');
    if (lt) { localStorage.setItem('prograv_lt', lt); history.replaceState(null, '', location.pathname + location.search); }
  } catch(e){}
  function pgToken(){ try { return localStorage.getItem('prograv_lt') || ''; } catch(e){ return ''; } }
  window.PGTrack = {
    send: function(ev){
      var t = pgToken(); if (!t) return;
      try { fetch(API + '/api/progress', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t }, body: JSON.stringify(ev) }).catch(function(){}); } catch(e){}
    }
  };
  var startUrl = API + '/auth/start?target=' + TARGET;
  function showGate(msg, noBtn){
    if (document.getElementById('pgGate')) return;
    var g = document.createElement('div');
    g.id = 'pgGate';
    g.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#101c31;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;visibility:visible';
    g.innerHTML = '<div style="max-width:340px;text-align:center">'
      + '<div style="font-family:Libre Baskerville,serif;font-weight:700;font-size:20px;letter-spacing:.15em;margin-bottom:14px">PRO-GRAV</div>'
      + '<p style="font-size:14px;line-height:1.8;margin:0 0 8px">この教材は会員専用です</p>'
      + '<p style="font-size:12px;line-height:1.8;opacity:.85;margin:0 0 20px">' + msg + '</p>'
      + (noBtn ? '' : '<a href="' + startUrl + '" style="display:block;background:#06C755;color:#fff;font-weight:bold;font-size:15px;padding:13px 10px;border-radius:10px;text-decoration:none">LINEでログイン</a>')
      + '</div>';
    document.body.appendChild(g);
  }
  function showMemberName(r){
    var label = (r.surname || (r.name || '').split(/[\s　]/)[0] || '');
    if (!label) return;
    var host = document.querySelector('.g-head-in');
    if (!host || document.getElementById('pgMemberName')) return;
    var el = document.createElement('span');
    el.id = 'pgMemberName';
    el.style.cssText = 'margin-left:auto;font-size:12px;color:var(--navy);border:1px solid #b9975b;border-radius:999px;padding:3px 10px;white-space:nowrap';
    el.textContent = label + 'さん';
    host.appendChild(el);
  }
  function checkMe(t){
    fetch(API + '/api/me', { headers: { 'Authorization': 'Bearer ' + t } })
      .then(function(r){ if (r.status === 403) return { notEligible: true }; return r.ok ? r.json() : null; })
      .then(function(j){
        if (j && j.notEligible) { showGate('この教材は、ご契約後にご覧いただけます。ご契約の状況については、トレーナーにお問い合わせください', true); return; }
        if (j && j.result) {
          document.documentElement.classList.remove('pg-locked');
          showMemberName(j.result);
        } else {
          try { localStorage.removeItem('prograv_lt'); } catch(e){}
          showGate('ログインの有効期限が切れています。再度ログインをお願いします');
        }
      })
      .catch(function(){ showGate('通信エラーが発生しました。電波の良い場所でもう一度開いてください'); });
  }
  var LIFF_ID = '2012731779-bSJlL5Vy';
  function tryLiff(){
    var done = false;
    function fallback(){ if (!done) { done = true; showGate('学習の記録のため、LINEログインをお願いしています'); } }
    var sc = document.createElement('script');
    sc.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    sc.onerror = fallback;
    sc.onload = function(){
      try {
        liff.init({ liffId: LIFF_ID }).then(function(){
          if (!liff.isInClient() || !liff.isLoggedIn()) { fallback(); return; }
          var at = liff.getAccessToken();
          if (!at) { fallback(); return; }
          fetch(API + '/api/liff-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accessToken: at }) })
            .then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j }; }); })
            .then(function(x){
              if (x.status === 200 && x.j && x.j.result && x.j.result.token) {
                done = true;
                try { localStorage.setItem('prograv_lt', x.j.result.token); } catch(e){}
                checkMe(x.j.result.token);
              } else if (x.j && x.j.error === 'not_linked') {
                done = true; showGate('まだ連携が完了していません。トレーナーから届いた招待リンクを開いて、連携を完了してください', true);
              } else if (x.j && x.j.error === 'not_eligible') {
                done = true; showGate('この教材は、ご契約後にご覧いただけます。ご契約の状況については、トレーナーにお問い合わせください', true);
              } else { fallback(); }
            })
            .catch(fallback);
        }).catch(fallback);
      } catch(e){ fallback(); }
    };
    document.head.appendChild(sc);
  }
  var t = pgToken();
  if (t) { checkMe(t); return; }
  if (navigator.userAgent.indexOf(' Line/') >= 0) { tryLiff(); return; }
  showGate('学習の記録のため、LINEログインをお願いしています');
})();
</script>
<script>
/* 左端スワイプで前の画面に戻る（LINEアプリ内ブラウザ用） */
(function(){
  var sx = null, sy = null;
  document.addEventListener('touchstart', function(e){
    if (e.touches.length === 1 && e.touches[0].clientX <= 24) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
    else { sx = null; }
  }, { passive: true });
  document.addEventListener('touchend', function(e){
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (dx < 64 || Math.abs(dy) > 48) return;
    if (document.documentElement.classList.contains('pg-locked')) return;
    var h = location.hash || '';
    if (h === '' || h === '#' || h === '#/') return;
    history.back();
  }, { passive: true });
})();
</script>
